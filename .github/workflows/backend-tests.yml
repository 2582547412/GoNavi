name: Backend Tests

on:
  pull_request:
    branches:
      - dev
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.ref == 'automation/star-history' }}
    name: Frontend clean build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Test gallery browser adapters
        working-directory: frontend
        run: npm test -- src/backgroundGallery
      - name: Test i18n key resolution invariant
        working-directory: frontend
        # 插件动态 key（如 plugin.state.*）也在该不变量覆盖范围内。
        run: npm test -- src/i18n/keyResolution.test.ts --maxWorkers=1 --minWorkers=1

      - name: Test plugin extension UI contracts
        working-directory: frontend
        # 覆盖整个插件前端树：根目录的清单解码、界面校验和文案一致性测试
        # 同样在门禁内，不能只跑四个子目录。
        run: npm test -- src/plugins --maxWorkers=2 --minWorkers=1
      - name: Test independent TypeScript plugin SDK
        working-directory: sdk/typescript
        run: |
          node ../../frontend/node_modules/typescript/bin/tsc --noEmit -p tsconfig.json
          node ../../frontend/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM test/manifest-types.ts
          node ../../frontend/node_modules/vitest/vitest.mjs run --config vitest.config.mjs
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  full:
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.ref == 'automation/star-history' }}
    name: Full backend suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare frontend embed
        shell: bash
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html><title>GoNavi test</title>\n' > frontend/dist/index.html
          cp tools/stub-dist.tar.br frontend/dist.tar.br

      - name: Install Wails Linux build dependencies
        # assets_prod_test.go 引入 wails/v2/pkg/assetserver，linux 上经
        # assetserver_webview.go 无条件依赖 webkit2gtk CGO，缺少时根包
        # 测试构建直接失败。ubuntu-24.04 起 libwebkit2gtk-4.0-dev 已移除，
        # 安装 4.1 开发包并配合 webkit2_41 构建标签（wails v2.11 原生支持）。
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Check Linux Wails build tags
        run: python3 tools/backend-workflow.test.py

      - name: Run backend tests
        run: go test -tags webkit2_41 ./... -count=1 -timeout=30m

      # DuckDB 附加模块带 gonavi_duckdb_driver 构建标签（需 CGO），主套件
      # 的 webkit2_41 标签不编译这批文件；单独跑一遍防止无覆盖回归。
      - name: Run DuckDB driver tests
        env:
          CGO_ENABLED: 1
        # App tests include Wails assetserver CGO even when -run selects only DuckDB.
        run: go test -tags webkit2_41,gonavi_duckdb_driver ./internal/db/ ./internal/app/ -run 'DuckDB|Attach|Slugify|SavedConnection|ConnectionSecret|BuildDuckDB|SameExternal|ParseDuckDB|SecretCleanup' -count=1 -timeout=30m

      # Kafka、RocketMQ、Pulsar 改为驱动代理后带各自的构建标签，主套件不再编译这批
      # 文件；单独跑一遍保留原有覆盖。
      - name: Run message queue driver tests
        run: go test -tags gonavi_kafka_driver,gonavi_rocketmq_driver,gonavi_pulsar_driver ./internal/db/ -count=1 -timeout=30m

      # The default suite excludes native SQL Server files used by driver-agent builds.
      - name: Run SQL Server driver tests
        run: go test -tags gonavi_sqlserver_driver ./internal/db/ -count=1 -timeout=30m

  marketplace-contract:
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.ref == 'automation/star-history' }}
    name: Plugin and marketplace contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gonavi
          POSTGRES_PASSWORD: gonavi_ci_only
          POSTGRES_DB: gonavi_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gonavi -d gonavi_market_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GONAVI_MARKET_TEST_POSTGRES: postgres://gonavi:gonavi_ci_only@127.0.0.1:5432/gonavi_market_test?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Test real PostgreSQL transactions and plugin races
        run: go test -race ./internal/plugin ./internal/pluginmarket ./internal/market -count=1 -timeout=10m
      - name: Test datasource adapter lifecycle races
        run: go test -race ./internal/db -run '^TestPluginDatabase' -count=1 -timeout=5m
      - name: Test plugin AI provider streaming races
        run: go test -race ./internal/ai/provider -run '^TestPlugin' -count=1 -timeout=5m
      - name: Test plugin exporter snapshot races
        run: go test -race ./internal/dataexport -run '^TestPlugin' -count=1 -timeout=5m
      - name: Test independent plugin SDK and examples
        run: |
          go -C sdk/go test -race ./... -count=1
          go -C examples/plugins test ./... -count=1

  platform-sensitive:
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.ref == 'automation/star-history' }}
    name: Platform-sensitive tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Test AI file errors
        run: go test ./internal/ai/service -run '^TestMCPClientInstallConfigIOFailuresUseServiceLanguage$' -count=1

      - name: Test Claude CLI timing
        run: go test ./internal/ai/provider -run '^TestClaudeCLIProvider_(ChatStreamUsesRequestTimeoutWhenNoMeaningfulResponseArrives|ChatStreamAllowsDelayedMeaningfulResponse)$' -count=1

      - name: Test JVM fixtures
        run: go test ./internal/jvm -run '^(TestAgentProviderRealAgentRoundTrip|TestHTTPProviderRealEndpointRoundTrip|TestJMXProviderRealJMXRoundTrip)$' -count=1 -timeout=5m

      - name: Test plugin process isolation and market client
        run: go test ./internal/plugin ./internal/pluginmarket ./internal/nativewindow -count=1 -timeout=5m

      - name: Test plugin datasource adapter and host integration
        run: go test ./internal/db ./internal/app ./internal/mcpserver ./internal/ai/provider ./internal/ai/service ./internal/dataexport -run '^TestPlugin' -count=1 -timeout=5m

      - name: Test optional driver-agent cleanup
        run: go test ./internal/db -run '^TestOptionalDriverAgentUnresponsiveProcessIsReapedAfterTimeout$' -count=1

  # 门禁：前端、完整后端、跨平台和插件市场契约全部成功才通过。
  # 矩阵任一失败时 platform-sensitive 的 result 为 failure。
  gate:
    name: CI Gate
    needs: [frontend, full, platform-sensitive, marketplace-contract]
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request_target' || github.event.pull_request.head.ref == 'automation/star-history') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FULL_RESULT: ${{ needs.full.result }}
          PLATFORM_RESULT: ${{ needs.platform-sensitive.result }}
          MARKETPLACE_RESULT: ${{ needs.marketplace-contract.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Frontend clean build: ${FRONTEND_RESULT}"
          echo "Full backend suite: ${FULL_RESULT}"
          echo "Platform-sensitive tests (macos-latest, windows-latest): ${PLATFORM_RESULT}"
          echo "Plugin and marketplace contracts: ${MARKETPLACE_RESULT}"
          if [[ "${FRONTEND_RESULT}" != "success" || "${FULL_RESULT}" != "success" || "${PLATFORM_RESULT}" != "success" || "${MARKETPLACE_RESULT}" != "success" ]]; then
            echo "CI 门禁未通过：Frontend clean build、Full backend suite、Platform-sensitive tests (macos-latest)、Platform-sensitive tests (windows-latest)、Plugin and marketplace contracts 必须全部成功。"
            exit 1
          fi
          echo "CI 门禁通过。"
